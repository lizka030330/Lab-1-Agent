name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Типи, лінт, тести, збірка
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Встановлення залежностей
        run: npm ci

      - name: Перевірка типів
        run: npm run typecheck

      - name: Лінт
        run: npm run lint

      - name: Юніт-тести
        run: npm test

      - name: Валідатор еталонного набору (Лаб. 2)
        run: npx tsx scripts/validate-golden.ts docs/lab2/golden/queries.jsonl

      - name: Збірка
        run: npm run build

  e2e:
    name: Playwright (не блокує)
    runs-on: ubuntu-latest
    needs: verify
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Встановлення залежностей
        run: npm ci

      - name: Встановлення браузерів Playwright
        run: npx playwright install --with-deps chromium

      - name: E2E-тести
        run: npm run e2e

      - name: Скріншоти та звіт як артефакти
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  verify-gate:
    name: Верифікатор на іншій моделі (брама злиття в main)
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Встановлення залежностей
        run: npm ci

      - name: Diff пул-реквесту відносно main
        run: git diff origin/${{ github.base_ref }}...HEAD > docs/lab2/verify-input.diff

      - name: Верифікатор (Gemini, інший провайдер, ніж автор коду)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VERIFY_MODEL: gemini-3.5-flash-lite
        run: npm run verify

      - name: Звіт верифікатора як артефакт
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verify-report
          path: docs/lab2/verify-report.json
          retention-days: 30
          if-no-files-found: ignore
