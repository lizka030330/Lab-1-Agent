# Ланцюг детермінованих брам (Лаб. 3, крок 01): types → lint → tests → build → record.
# Найдешевша й найвизначеніша перевірка — перша; поки types червоні, решта не запускається (needs).
# Версії дій — ті, що вже працюють у ci.yml цього репозиторію: checkout@v7, setup-node@v7 (Node 24).
# Опис і докази — docs/lab3/gates.md.
name: gates

on:
  push:
  pull_request:
  workflow_dispatch: # крок 04: ручний прогін брами evals

# новий push у ту саму гілку скасовує попередній прогін
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  types:
    runs-on: ubuntu-latest
    timeout-minutes: 5 # без цього діє типове значення 360 хвилин
    outputs:
      verdict: ${{ steps.g.outputs.verdict }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: g
        run: |
          npm run typecheck
          echo "verdict=pass" >> "$GITHUB_OUTPUT"

  lint:
    needs: types # типи зелені — тільки тоді лінт
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      verdict: ${{ steps.g.outputs.verdict }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: g
        run: |
          npm run lint
          echo "verdict=pass" >> "$GITHUB_OUTPUT"

  tests:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      verdict: ${{ steps.g.outputs.verdict }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: g
        run: |
          npm test
          echo "verdict=pass" >> "$GITHUB_OUTPUT"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: gate-tests
          path: docs/lab3/runs/**
          if-no-files-found: ignore

  build:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      verdict: ${{ steps.g.outputs.verdict }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: g
        run: |
          npm run build
          echo "verdict=pass" >> "$GITHUB_OUTPUT"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: gate-build
          path: .next/build-manifest.json # Next збирає в .next/, не в dist/; повна тека — сотні МБ
          if-no-files-found: ignore

  record:
    # складається й на червоному прогоні; needs бачить ЛИШЕ прямі залежності,
    # тому тут перелічені всі чотири брами, а не одна остання
    needs: [types, lint, tests, build]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # щоб знайти run.json, які ця гілка додала відносно main
      - uses: actions/download-artifact@v8 # інший мажор, ніж в upload — так і має бути
        with:
          path: incoming
          merge-multiple: true
      - name: Вердикти брам у журнал прогону
        env:
          V_TYPES: ${{ needs.types.result }}
          V_LINT: ${{ needs.lint.result }}
          V_TESTS: ${{ needs.tests.result }}
          V_BUILD: ${{ needs.build.result }}
          O_TYPES: ${{ needs.types.outputs.verdict }}
          O_LINT: ${{ needs.lint.outputs.verdict }}
          O_TESTS: ${{ needs.tests.outputs.verdict }}
          O_BUILD: ${{ needs.build.outputs.verdict }}
        run: |
          node scripts/harness/record-gates.mjs \
            --types "$V_TYPES" --lint "$V_LINT" --tests "$V_TESTS" --build "$V_BUILD" \
            --types-out "$O_TYPES" --lint-out "$O_LINT" --tests-out "$O_TESTS" --build-out "$O_BUILD" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - uses: actions/upload-artifact@v7
        with:
          name: gate-record
          path: |
            gate-record.json
            gate-record/**

  # Крок 04: регресійна брама evals. Агент — справжній (OpenCode + Gemini), тому:
  # — лише на pull_request (і вручну): push у гілку квоту не витрачає;
  # — лише кошик regression і k = 1: добова квота ключа (500 запитів gemini-3.5-flash-lite) одна на CI і на локальні
  #   прогони, а повний банк з k = 3 її не витримує. Повні числа pass@k / pass^k — локально, docs/lab3/evals.md.
  # Брама — gate.ts: задача regression, що в базовому рівні мала pass^3 = 1, мусить пройти й тут. Без || true
  # і без continue-on-error: інакше збірка зелена завжди, а брами не існує.
  evals:
    needs: tests # неявний success(): на червоних тестах не стартує
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50 # типове — 360; 13 задач × ~1–2 хв + встановлення (t-08 за 25 хв не встигав)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: OpenCode — та сама версія, що локально
        timeout-minutes: 3
        run: npm install -g opencode-ai@1.18.34 && opencode --version
      - name: Детерміновані оцінювачі на замороженому банку (regression, k = 1)
        timeout-minutes: 45
        env:
          EVAL_K: '1'
          EVAL_BUCKET: regression
          EVAL_LOG: docs/lab3/evals-ci.jsonl
          HARNESS_MODEL: google/gemini-3.5-flash-lite
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
        run: |
          npx tsx scripts/evals/run-evals.ts docs/lab3/tasks.jsonl
          npx tsx scripts/evals/gate.ts
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: evals
          path: docs/lab3/evals-ci.jsonl
          if-no-files-found: ignore
