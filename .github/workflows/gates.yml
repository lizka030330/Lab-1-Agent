# Ланцюг детермінованих брам (Лаб. 3, крок 01): types → lint → tests → build → record.
# Найдешевша й найвизначеніша перевірка — перша; поки types червоні, решта не запускається (needs).
# Версії дій — ті, що вже працюють у ci.yml цього репозиторію: checkout@v7, setup-node@v7 (Node 24).
# Опис і докази — docs/lab3/gates.md.
name: gates

on:
  push:
  pull_request:

# новий push у ту саму гілку скасовує попередній прогін
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  types:
    runs-on: ubuntu-latest
    timeout-minutes: 5 # без цього діє типове значення 360 хвилин
    outputs:
      verdict: ${{ steps.g.outputs.verdict }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: g
        run: |
          npm run typecheck
          echo "verdict=pass" >> "$GITHUB_OUTPUT"

  lint:
    needs: types # типи зелені — тільки тоді лінт
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      verdict: ${{ steps.g.outputs.verdict }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: g
        run: |
          npm run lint
          echo "verdict=pass" >> "$GITHUB_OUTPUT"

  tests:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      verdict: ${{ steps.g.outputs.verdict }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: g
        run: |
          npm test
          echo "verdict=pass" >> "$GITHUB_OUTPUT"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: gate-tests
          path: docs/lab3/runs/**
          if-no-files-found: ignore

  build:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      verdict: ${{ steps.g.outputs.verdict }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: g
        run: |
          npm run build
          echo "verdict=pass" >> "$GITHUB_OUTPUT"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: gate-build
          path: .next/build-manifest.json # Next збирає в .next/, не в dist/; повна тека — сотні МБ
          if-no-files-found: ignore

  record:
    # складається й на червоному прогоні; needs бачить ЛИШЕ прямі залежності,
    # тому тут перелічені всі чотири брами, а не одна остання
    needs: [types, lint, tests, build]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # щоб знайти run.json, які ця гілка додала відносно main
      - uses: actions/download-artifact@v8 # інший мажор, ніж в upload — так і має бути
        with:
          path: incoming
          merge-multiple: true
      - name: Вердикти брам у журнал прогону
        env:
          V_TYPES: ${{ needs.types.result }}
          V_LINT: ${{ needs.lint.result }}
          V_TESTS: ${{ needs.tests.result }}
          V_BUILD: ${{ needs.build.result }}
          O_TYPES: ${{ needs.types.outputs.verdict }}
          O_LINT: ${{ needs.lint.outputs.verdict }}
          O_TESTS: ${{ needs.tests.outputs.verdict }}
          O_BUILD: ${{ needs.build.outputs.verdict }}
        run: |
          node scripts/harness/record-gates.mjs \
            --types "$V_TYPES" --lint "$V_LINT" --tests "$V_TESTS" --build "$V_BUILD" \
            --types-out "$O_TYPES" --lint-out "$O_LINT" --tests-out "$O_TESTS" --build-out "$O_BUILD" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - uses: actions/upload-artifact@v7
        with:
          name: gate-record
          path: |
            gate-record.json
            gate-record/**
